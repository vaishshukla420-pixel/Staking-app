[package]
name = "sol-yield-vault"
version = "0.1.0"
description = "SOL yield vault with ledger-based shares, performance fee, and pluggable venue rebalancing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_yield_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
