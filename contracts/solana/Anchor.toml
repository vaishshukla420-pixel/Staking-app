# Anchor workspace config for the SOL yield vault.
#
# PROGRAM ID NOTE: the id below is a fixed placeholder that matches
# `declare_id!` in programs/sol-yield-vault/src/lib.rs. No keypair for it is
# committed. Before deploying for real:
#   1. anchor build                       # generates target/deploy/sol_yield_vault-keypair.json
#   2. anchor keys sync                   # rewrites the id here and in lib.rs
#   3. anchor build && anchor deploy

[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
sol_yield_vault = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
sol_yield_vault = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
